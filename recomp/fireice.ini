; libroger's settings for fireice (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; Intro's Graftgold logo fills the screen
rows = all
; Fire, from its start-up (&81BC, where game.c enters it once it's
; decrypted): the Cool Coyote and Fire and Ice pictures use rows 0-195, the
; title, the map and the game 2-238 (the score line, the play area and the
; panel below it)
81BC = 0-238
